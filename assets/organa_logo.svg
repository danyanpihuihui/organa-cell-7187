<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0052ff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Outer Orbit Track -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Three Consensus Nodes (Triangle) -->
  <!-- Connection Lines -->
  <polygon points="250,90 120,330 380,330" fill="url(#glowGrad)" stroke="#0052ff" stroke-width="3" opacity="0.4"/>
  <polygon points="250,90 120,330 380,330" fill="none" stroke="url(#baseGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Central Hub: Bitmap 7187 Core -->
  <circle cx="250" cy="250" r="50" fill="#0b0f19" stroke="url(#baseGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Cell grid symbol in center -->
  <rect x="228" y="228" width="18" height="18" rx="3" fill="#0052ff"/>
  <rect x="254" y="228" width="18" height="18" rx="3" fill="#38bdf8"/>
  <rect x="228" y="254" width="18" height="18" rx="3" fill="#38bdf8"/>
  <rect x="254" y="254" width="18" height="18" rx="3" fill="#0052ff"/>

  <!-- Agent 1 Node (Alpha / Top) -->
  <circle cx="250" cy="90" r="28" fill="#0f172a" stroke="url(#baseGrad)" stroke-width="4" filter="url(#glow)"/>
  <text x="250" y="96" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">A1</text>

  <!-- Agent 2 Node (Beta / Bottom Left) -->
  <circle cx="120" cy="330" r="28" fill="#0f172a" stroke="url(#baseGrad)" stroke-width="4" filter="url(#glow)"/>
  <text x="120" y="336" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">A2</text>

  <!-- Agent 3 Node (Gamma / Bottom Right) -->
  <circle cx="380" cy="330" r="28" fill="#0f172a" stroke="url(#baseGrad)" stroke-width="4" filter="url(#glow)"/>
  <text x="380" y="336" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">A3</text>

  <!-- Brand Typography -->
  <text x="250" y="420" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="900" letter-spacing="8" fill="#f8fafc" text-anchor="middle">ORGANA</text>
  <text x="250" y="450" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#00d2ff" text-anchor="middle">AI CONSENSUS • BASE</text>
</svg>